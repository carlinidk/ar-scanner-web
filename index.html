<!DOCTYPE html>
<html>
  <head>
    <title>AR.js Camera Test</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/three.js/build/ar-threex.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
      canvas, video {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
      }
    </style>
  </head>
  <body>
    <script>
      let renderer, scene, camera, arToolkitSource, arToolkitContext;

      init();
      animate();

      function init() {
        // Renderer
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Scene + Camera
        scene = new THREE.Scene();
        camera = new THREE.Camera();
        scene.add(camera);

        // AR.js Source
        arToolkitSource = new THREEx.ArToolkitSource({
          sourceType: "webcam",
          facingMode: "environment" // ✅ back camera
        });

        // Init video source
        arToolkitSource.init(() => {
          onResize();
        });

        // Debug: force attach video element
        if (arToolkitSource.domElement) {
          arToolkitSource.domElement.setAttribute("id", "arjs-video");
          arToolkitSource.domElement.setAttribute("playsinline", "");
          arToolkitSource.domElement.style.position = "fixed";
          arToolkitSource.domElement.style.top = "0";
          arToolkitSource.domElement.style.left = "0";
          arToolkitSource.domElement.style.width = "100%";
          arToolkitSource.domElement.style.height = "100%";
          arToolkitSource.domElement.style.zIndex = "-1";
          document.body.appendChild(arToolkitSource.domElement);
        }

        // AR.js Context
        arToolkitContext = new THREEx.ArToolkitContext({
          cameraParametersUrl: "https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/three.js/data/camera_para.dat",
          detectionMode: "mono"
        });

        arToolkitContext.init(() => {
          camera.projectionMatrix.copy(arToolkitContext.getProjectionMatrix());
        });

        window.addEventListener("resize", onResize);
      }

      function onResize() {
        arToolkitSource.onResize();
        arToolkitSource.copySizeTo(renderer.domElement);
        if (arToolkitContext.arController !== null) {
          arToolkitSource.copySizeTo(arToolkitContext.arController.canvas);
        }
      }

      function animate() {
        requestAnimationFrame(animate);

        if (arToolkitSource.ready) {
          arToolkitContext.update(arToolkitSource.domElement);
        }

        renderer.render(scene, camera);
      }
    </script>
  </body>
</html>
