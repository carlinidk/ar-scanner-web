<!DOCTYPE html>
<html>
  <head>
    <title>WebAR Live Feed</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.min.js"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        height: 100%;
        width: 100%;
      }

      #loading {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0,0,0,0.8);
        color: white;
        font-family: sans-serif;
        z-index: 10;
      }

      /* hide loading smoothly */
      #loading.hidden {
        opacity: 0;
        transition: opacity 0.5s ease;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="loading">📷 Accessing camera...</div>

    <a-scene
      embedded
      vr-mode-ui="enabled: false"
      renderer="antialias: true; alpha: true;"
      arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
    >
      

      <!-- Marker -->
      <a-marker type="pattern" url="qr1.patt">
        <a-entity
          gltf-model="#planeModel"
          scale="0.3 0.3 0.3"
          rotation="0 180 0"
          position="0 0 0"
          animation="property: rotation; to: 0 540 0; loop: true; dur: 5000; easing: linear"
        ></a-entity>
      </a-marker>

      <!-- Assets -->
      <a-assets>
        <a-asset-item id="planeModel" src="Models/iphone.glb"></a-asset-item>
      </a-assets>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      // Hide loading overlay once camera feed starts
      const scene = document.querySelector('a-scene');
      scene.addEventListener('loaded', () => {
        const loading = document.getElementById('loading');
        if (loading) loading.classList.add('hidden');
      });
    </script>
  </body>
</html>
