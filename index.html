<!DOCTYPE html>
<html>
  <head>
    <title>WebAR QR Scanner</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,500&display=swap" rel="stylesheet">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.min.js"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        background: #FFFDF2;
        font-family: 'Roboto', Arial, sans-serif;
        color: #000000;
        overflow: hidden;
      }
      #instructions {
        position: absolute;
        top: 24px;
        width: 100%;
        text-align: center;
        z-index: 10;
        font-size: 1.2rem;
        font-weight: 500;
        letter-spacing: 0.01em;
        background: rgba(255,253,242,0.85);
        padding: 12px 0;
        border-radius: 8px;
        box-shadow: 0 2px 16px rgba(0,0,0,0.03);
      }
      #spinner {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 20;
        width: 48px;
        height: 48px;
        border: 4px solid #000000;
        border-top: 4px solid #FFFDF2;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        background: transparent;
      }
      @keyframes spin {
        0% { transform: translate(-50%, -50%) rotate(0deg);}
        100% { transform: translate(-50%, -50%) rotate(360deg);}
      }
      a-scene {
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div id="instructions">Point your camera at the QR marker</div>
    <div id="spinner"></div>
    <a-scene embedded arjs style="width:100vw; height:100vh; margin:0; padding:0;"
      vr-mode-ui="enabled: false"
      loading-screen="enabled: false"
      >
      <a-marker type="pattern" url="qr1.patt">
        <a-entity gltf-model="#model" scale="0.5 0.5 0.5" position="0 0 0"></a-entity>
      </a-marker>

      <a-assets>
        <a-asset-item id="model" src="Main_model.glb"></a-asset-item>
      </a-assets>

      <a-entity
        camera="fov: 95; near: 0.01; far: 1000"
        arjs-camera="sourceType: webcam"
        position="0 0 0">
      </a-entity>
    </a-scene>
    <script>
      // Hide spinner when scene is loaded
      document.querySelector('a-scene').addEventListener('loaded', function () {
        document.getElementById('spinner').style.display = 'none';
      });
    </script>
  </body>
</html>
