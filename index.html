<!DOCTYPE html>
<html>
  <head>
    <title>WebAR QR Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.rawgit.com/jeromeetienne/ar.js/2.2.1/three.js/build/ar-threex.min.js"></script>
  </head>
  <body style="margin:0; overflow:hidden;">
    <script>
      // Scene + Camera
      let scene = new THREE.Scene();
      let camera = new THREE.Camera();
      scene.add(camera);

      let renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.domElement.style.position = 'absolute';
      renderer.domElement.style.top = '0px';
      renderer.domElement.style.left = '0px';
      document.body.appendChild(renderer.domElement);

      // AR Source (Camera)
      let arSource = new THREEx.ArToolkitSource({ sourceType: 'webcam' });
      arSource.init(function() {
        setTimeout(() => {
          onResize();
        }, 2000);
      });

      window.addEventListener('resize', () => {
        onResize();
      });

      function onResize() {
        arSource.onResize();
        arSource.copySizeTo(renderer.domElement);
        if (arContext.arController !== null) {
          arSource.copySizeTo(arContext.arController.canvas);
        }
      }

      // AR Context
      let arContext = new THREEx.ArToolkitContext({
        cameraParametersUrl: 'https://cdn.rawgit.com/jeromeetienne/ar.js/master/data/data/camera_para.dat',
        detectionMode: 'mono'
      });

      arContext.init(function() {
        camera.projectionMatrix.copy(arContext.getProjectionMatrix());
      });

      // Marker Controls
      let markerRoot = new THREE.Group();
      scene.add(markerRoot);

      let markerControls = new THREEx.ArMarkerControls(arContext, markerRoot, {
        type: 'pattern',
        patternUrl: 'https://cdn.rawgit.com/jeromeetienne/ar.js/master/data/data/patt.hiro'
      });

      // Add a Cube (for testing)
      let cube = new THREE.Mesh(
        new THREE.BoxGeometry(1,1,1),
        new THREE.MeshNormalMaterial()
      );
      cube.position.y = 0.5;
      markerRoot.add(cube);

      // Animate
      function animate() {
        requestAnimationFrame(animate);
        if (arSource.ready) {
          arContext.update(arSource.domElement);
          scene.visible = camera.visible;
        }
        cube.rotation.y += 0.05; // spinning test
        renderer.render(scene, camera);
      }
      animate();
    </script>
  </body>
</html>
