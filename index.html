<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>WebAR QR T-shirt</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body, html { height:100%; margin:0; background:#000; }
    #hint { position:fixed; left:12px; top:12px; color:#fff; font-family:system-ui,Segoe UI,Roboto; background:rgba(0,0,0,0.45); padding:8px; border-radius:6px; z-index:9999; }
  </style>
</head>
<body>
  <div id="hint">Point your camera at the QR code to see the AR model</div>

  <a-scene mindar-image="imageTargetSrc: https://raw.githubusercontent.com/carlinidk/ar-scanner-web/main/targets.mind; maxTrack:1;" embedded color-space="sRGB" vr-mode-ui="enabled: false">
    <a-entity camera></a-entity>

    <!-- Model appears on the QR code target -->
    <a-entity mindar-image-target="targetIndex:0">
      <a-entity gltf-model="https://raw.githubusercontent.com/carlinidk/ar-scanner-web/main/plane.glb"
                scale="0.08 0.08 0.08"
                rotation="0 180 0"
                position="0 0 0">
      </a-entity>
    </a-entity>

    <a-entity light="type: directional; intensity:0.8" position="0 1 1"></a-entity>
    <a-entity light="type: ambient; intensity:0.6"></a-entity>
  </a-scene>

  <script>
    const scene = document.querySelector('a-scene');
    scene.addEventListener('loaded', ()=>{ console.log('A-Frame scene loaded'); });
    scene.addEventListener('arReady', ()=>{ console.log('AR ready! Camera started.'); });
  </script>
</body>
</html>
