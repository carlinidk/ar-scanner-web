<!DOCTYPE html>
<html>
  <head>
    <title>WebAR QR Scanner - QR 1</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- Updated A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- Updated AR.js (better compatibility) -->
    <script src="https://cdn.jsdelivr.net/npm/ar.js@3.4.3/aframe/build/aframe-ar.min.js"></script>

    <!-- Enhanced GLTF Loader -->
    <script src="https://unpkg.com/aframe-gltf-model-plus@3.0.4/dist/aframe-gltf-model-plus.min.js"></script>

    <style>
      html, body, a-scene {
        margin: 0;
        padding: 0;
        overflow: hidden;
        width: 100%;
        height: 100%;
        background: #000;
      }
    </style>
  </head>
  <body>
    <a-scene
      embedded
      arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false;"
      vr-mode-ui="enabled: false"
      renderer="logarithmicDepthBuffer: true; antialias: true;"
      style="width: 100%; height: 100%; margin: 0; padding: 0;"
    >
      <!-- Marker for QR1 -->
      <a-marker type="pattern" url="qr1.patt">
        <!-- Enhanced glTF model loader -->
        <a-entity
          gltf-model-plus="src: #planeModel"
          scale="0.03 0.03 0.03"
          position="0 0 0"
        ></a-entity>
      </a-marker>

      <!-- Assets -->
      <a-assets>
        <a-asset-item id="planeModel" src="Models/Seahawk.glb"></a-asset-item>
      </a-assets>

      <!-- Camera -->
      <a-entity
        camera="fov: 95; near: 0.01; far: 1000"
        arjs-camera
      ></a-entity>
    </a-scene>

    <script>
      // Basic error catcher
      window.addEventListener('error', (e) => {
        console.error('❌ WebAR Error:', e.message);
      });

      // Fallback to regular gltf-model if plus fails
      AFRAME.registerComponent('model-fallback', {
        init: function () {
          const el = this.el;
          el.addEventListener('model-error', () => {
            console.warn('⚠️ gltf-model-plus failed, switching to gltf-model...');
            const src = el.getAttribute('gltf-model-plus');
            el.removeAttribute('gltf-model-plus');
            el.setAttribute('gltf-model', src);
          });
        },
      });

      document.querySelectorAll('[gltf-model-plus]').forEach((el) => {
        el.setAttribute('model-fallback', '');
      });
    </script>
  </body>
</html>
