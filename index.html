<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome to WebAR</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Poppins", sans-serif;
    }

    body {
      height: 100vh;
      background: linear-gradient(135deg, #001f3f, #0074D9);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      overflow: hidden;
      position: relative;
    }

    .container {
      text-align: center;
      z-index: 10;
      animation: fadeIn 1.5s ease;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      letter-spacing: 1px;
    }

    p {
      font-size: 1.1rem;
      margin-bottom: 2rem;
      color: #dfe6e9;
    }

    button {
      background-color: #00a8ff;
      border: none;
      padding: 14px 32px;
      border-radius: 6px;
      color: white;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background-color: #0097e6;
      transform: scale(1.05);
    }

    /* Fade-out transition */
    .fade-out {
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Optional animated background */
    .background-shapes {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
    }

    .circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      animation: float 8s infinite ease-in-out;
    }

    .circle:nth-child(1) { width: 200px; height: 200px; top: 10%; left: 15%; animation-delay: 0s; }
    .circle:nth-child(2) { width: 300px; height: 300px; bottom: 20%; right: 10%; animation-delay: 2s; }
    .circle:nth-child(3) { width: 150px; height: 150px; top: 60%; left: 70%; animation-delay: 4s; }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    /* Footer with contact info */
    footer {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.8);
      z-index: 10;
      animation: fadeIn 2s ease;
    }

    footer a {
      color: #00a8ff;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    footer a:hover {
      color: #fff;
    }
  </style>
</head>

<body>
  <div class="background-shapes">
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
  </div>

  <div class="container">
    <h1>Carlin's WebAR Experience 🌐</h1>
    <p>Scan your marker to explore the 3D model in AR!</p>
    <button id="enterBtn">Enter AR Experience</button>
  </div>

  <!-- Footer with your info -->
  <footer>
    <p>
      Follow me on 
      <a href="https://instagram.com/carlindsouza" target="_blank">@carlindsouza</a>
      • Email:
      <a href="mailto:carlindsouza4@gmail.com">carlindsouza4@gmail.com</a>
    </p>
  </footer>

  <script>
    const btn = document.getElementById('enterBtn');
    btn.addEventListener('click', () => {
      document.body.classList.add('fade-out');
      setTimeout(() => {
        window.location.href = 'webar.html';
      }, 800);
    });
  </script>
</body>
</html>
