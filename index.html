<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome to WebAR</title>
  
  <!-- Load Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    /* Custom CSS for the fixed background and custom animation */
    body {
      /* Use a dark, dynamic gradient */
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
      font-family: 'Inter', sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    /* Keyframe for subtle floating effect on background elements */
    @keyframes float {
      0% { transform: translate(0, 0) rotate(0deg); }
      50% { transform: translate(-20px, 30px) rotate(5deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }

    .shape {
      position: absolute;
      background: rgba(129, 140, 248, 0.1); /* Indigo 300 with transparency */
      border-radius: 50%;
      filter: blur(80px); /* Heavy blur for a glow effect */
      animation: float 15s infinite ease-in-out;
      z-index: 0;
    }
    
    .shape-1 { width: 300px; height: 300px; top: 10%; left: 10%; animation-delay: 0s; }
    .shape-2 { width: 400px; height: 400px; bottom: 5%; right: 5%; animation-delay: -5s; }
    .shape-3 { width: 200px; height: 200px; top: 50%; right: 70%; animation-delay: -10s; }
    
    /* Fade-out transition for the body */
    .fade-out {
      opacity: 0;
      transition: opacity 0.8s ease;
    }
    
    /* Fade-in for the main container */
    .fade-in {
        animation: fadeIn 1.5s ease forwards;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* --- Custom AR Ring Loader styles --- */
    @keyframes loader {
      /* Adjusted to use a more dramatic 3D rotation and scale */
      from {transform: translate(-50%, -50%) scale(1) rotateY(0deg) rotateX(0deg) rotateZ(0deg)}
      to {transform: translate(-50%, -50%) scale(1.7) rotateY(180deg) rotateX(180deg) rotateZ(180deg)} 
    }

    .ar-ring-container {
      position: relative;
      /* Define a fixed size container for the animated elements */
      width: 4rem; 
      height: 4rem;
      margin: 0 auto; 
    }
    
    .ring {
      position: absolute;
      left: 50%;
      top: 50%;
      /* Centering the ring itself (critical for the animation origin) */
      transform: translate(-50%, -50%); 
      width: 3.5rem;
      height: 3.5rem;
      border: 4px solid #818cf8; /* Indigo 300 */
      border-radius: 50%;
      animation: loader 1.5s infinite;
      animation-timing-function: cubic-bezier(1,0,0,1);
      animation-direction: alternate;
      /* Matching glow effect with the indigo theme */
      box-shadow:
        0 0 3px rgba(129, 140, 248, 0.4) inset,
        0 0 8px #a5b4fc, 
        0 0 10px #818cf8; 
    }
    
    /* Animation delays for cascading effect */
    .ring-2 {
      animation-delay: 250ms;
      border: 4px solid #a5b4fc; 
    }
    .ring-3 {
      animation-delay: 500ms;
      border: 4px solid #c7d2fe; 
    }
    .ring-4 {
      animation-delay: 750ms;
      border: 4px solid #e0e7ff; 
    }
  </style>
</head>

<body class="h-screen flex items-center justify-center fade-in">
  
  <!-- Animated Background Shapes -->
  <div class="shape shape-1"></div>
  <div class="shape shape-2"></div>
  <div class="shape shape-3"></div>

  <!-- Main Content Container -->
  <div class="container text-center z-10 p-8 md:p-12 
              bg-gray-900/80 backdrop-blur-sm 
              rounded-2xl shadow-2xl max-w-xl w-11/12 
              transform transition duration-500 hover:shadow-indigo-500/50">
    
    <div class="space-y-4">
        
        <!-- NEW ANIMATED RING ICON -->
        <div class="ar-ring-container mb-6">
            <div class="ring"></div>
            <div class="ring ring-2"></div>
            <div class="ring ring-3"></div>
            <div class="ring ring-4"></div>
        </div>
        
        <h1 class="text-4xl font-extrabold text-white tracking-tight sm:text-5xl">
          Carlin's <span class="text-indigo-400">WebAR</span> Gateway
        </h1>
        
        <p class="text-lg text-gray-300 pt-2">
          Step into a new reality. Scan your marker and explore the future of augmented digital models.
        </p>
    </div>
    
    <!-- Action Button -->
    <button id="enterBtn" 
            class="mt-8 w-full sm:w-auto 
                   bg-indigo-600 hover:bg-indigo-500 
                   text-white font-bold text-xl 
                   py-3 px-10 rounded-xl transition duration-300 
                   shadow-lg shadow-indigo-600/50 
                   focus:outline-none focus:ring-4 focus:ring-indigo-500 focus:ring-opacity-50">
      Launch AR Experience
    </button>
    
    <!-- Footer/Contact Info -->
    <footer class="mt-8 text-sm text-gray-400">
      Connect: 
      <a href="https://instagram.com/carlindsouza" target="_blank" class="text-indigo-300 hover:text-indigo-200 transition">@carlindsouza</a>
      <span class="mx-2">•</span>
      <a href="mailto:carlindsouza4@gmail.com" class="text-indigo-300 hover:text-indigo-200 transition">carlindsouza4@gmail.com</a>
    </footer>
    
  </div>

  <script>
    // JavaScript for smooth fade-out and redirection
    const btn = document.getElementById('enterBtn');
    btn.addEventListener('click', () => {
      // Use the body class to trigger the fade-out
      document.body.classList.add('fade-out');
      
      // Remove the fade-in class so it doesn't conflict with fade-out
      document.body.classList.remove('fade-in'); 

      // Wait for the fade-out transition to complete (0.8s) before redirecting
      setTimeout(() => {
        window.location.href = 'webar.html';
      }, 800);
    });
  </script>
</body>
</html>
