<!DOCTYPE html>
<html>
  <head>
    <title>WebAR QR Scanner - QR 1</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.min.js"></script>
    <style>
      html, body, a-scene {
        margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%;
      }
      #controls {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 999;
        text-align: center;
        background: rgba(0, 0, 0, 0.6);
        padding: 10px 20px;
        border-radius: 8px;
        color: white;
        font-family: Arial, sans-serif;
      }
      #rotateBtn {
        display: block;
        margin-bottom: 8px;
        padding: 8px 18px;
        background: #0078ff;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
      }
      #speedSlider {
        width: 150px;
        cursor: pointer;
      }
      #speedLabel {
        font-size: 14px;
        display: block;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <a-scene embedded arjs style="width:100%; height:100%; margin:0; padding:0;">
      <!-- Marker for QR1 -->
      <a-marker type="pattern" url="qr1.patt">
        <a-entity id="model" gltf-model="#planeModel" scale="0.15 0.15 0.15" position="0 0 0"></a-entity>
      </a-marker>

      <a-assets>
        <a-asset-item id="planeModel" src="Models/Seahawk.glb"></a-asset-item>
      </a-assets>

      <a-entity
        camera="fov: 95; near: 0.01; far: 1000"
        arjs-camera="sourceType: webcam"
        position="0 0 0">
      </a-entity>
    </a-scene>

    <div id="controls">
      <button id="rotateBtn">Rotate Model</button>
      <input type="range" id="speedSlider" min="0.2" max="5" value="1" step="0.1">
      <span id="speedLabel">Speed: 1x</span>
    </div>

    <script>
      const model = document.getElementById('model');
      const button = document.getElementById('rotateBtn');
      const speedSlider = document.getElementById('speedSlider');
      const speedLabel = document.getElementById('speedLabel');

      let rotating = false;
      let rotationInterval;
      let speed = 1;

      button.addEventListener('click', () => {
        if (!rotating) {
          rotationInterval = setInterval(() => {
            const rotation = model.getAttribute('rotation');
            rotation.y += speed; // use adjustable speed
            model.setAttribute('rotation', rotation);
          }, 16);
          button.textContent = 'Stop Rotation';
        } else {
          clearInterval(rotationInterval);
          button.textContent = 'Rotate Model';
        }
        rotating = !rotating;
      });

      // Update speed dynamically
      speedSlider.addEventListener('input', () => {
        speed = parseFloat(speedSlider.value);
        speedLabel.textContent = `Speed: ${speed.toFixed(1)}x`;
      });
    </script>
  </body>
</html>
