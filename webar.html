<!DOCTYPE html>
<html>
  <head>
    <title>WebAR QR Scanner - QR 1</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <style>
      /* --- Global Setup --- */
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        width: 100%;
        height: 100%;
        font-family: Arial, sans-serif;
      }
      a-scene {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }
      * {
        box-sizing: border-box;
      }

      /* --- Top Info Box --- */
      #info {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        padding: 10px 20px;
        border-radius: 6px;
        font-size: 16px;
        opacity: 0;
        transition: opacity 1s ease;
        z-index: 999;
        text-align: center;
      }
      #info.visible { opacity: 1; }
      #info.hidden { opacity: 0; }

      /* --- Bottom UI Container --- */
      .ui-container {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        z-index: 999;
        display: flex;
        flex-direction: column; 
        align-items: center;    
        padding: 15px;
        gap: 15px; 
        background: linear-gradient(to top, rgba(0,0,0,0.4), rgba(0,0,0,0));
      }

      /* ✅ NEW: Scale Control Row for Slider and Label (Idea 7) */
      .scale-control-row {
          display: flex;
          align-items: center;
          width: 80%;
          max-width: 300px;
          gap: 10px;
          background: rgba(0, 0, 0, 0.5);
          padding: 8px 12px;
          border-radius: 5px;
      }
      #scaleValue {
          color: white;
          font-size: 14px;
          font-weight: bold;
          min-width: 60px; /* fixed width for alignment */
          text-align: right;
      }


      /* --- Button Row --- */
      .button-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px; 
      }

      /* --- Generic Button Style --- */
      .button-row button {
        background: rgba(0, 0, 0, 0.7);
        color: white;
        border: none;
        padding: 12px 18px;
        border-radius: 5px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        touch-action: manipulation; 
        -webkit-tap-highlight-color: transparent;
        transition: background-color 0.2s ease;
      }
      
      .button-row button:hover {
        background: rgba(255, 255, 255, 0.3);
      }
      .button-row button:active {
        background: rgba(255, 255, 255, 0.5);
      }

      /* --- Scale Slider Style --- */
      #scaleSlider {
        flex-grow: 1; /* Allows slider to fill space in control row */
        -webkit-appearance: none;
        height: 8px;
        background: #888;
        border-radius: 5px;
        outline: none;
      }
      #scaleSlider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 20px;
        height: 20px;
        background: white;
        border-radius: 50%;
        cursor: pointer;
      }
      #scaleSlider::-moz-range-thumb {
        width: 20px;
        height: 20px;
        background: white;
        border-radius: 50%;
        cursor: pointer;
        border: 0;
      }
    </style>
    <script>
        AFRAME.registerComponent('fading-model', {
            schema: {
                visible: {type: 'boolean', default: true},
                fadeDuration: {type: 'number', default: 500} // milliseconds
            },

            init: function() {
                this.el.setAttribute('material', 'opacity: 1; transparent: true;');
                this.originalOpacity = 1;
                this.isFading = false;
            },

            update: function(oldData) {
                if (oldData.visible !== this.data.visible) {
                    this.toggleVisibility(this.data.visible);
                }
            },

            toggleVisibility: function(shouldBeVisible) {
                if (this.isFading) return;
                
                this.isFading = true;
                const targetOpacity = shouldBeVisible ? this.originalOpacity : 0;
                const startOpacity = parseFloat(this.el.getAttribute('material', 'opacity').opacity);
                const duration = this.data.fadeDuration;
                const startTime = performance.now();

                const animate = (time) => {
                    const elapsed = time - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const currentOpacity = startOpacity + (targetOpacity - startOpacity) * progress;
                    
                    this.el.setAttribute('material', 'opacity', currentOpacity);

                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    } else {
                        this.isFading = false;
                        // Hides the entity completely when faded out
                        this.el.setAttribute('visible', shouldBeVisible);
                    }
                };

                // Ensures the entity is visible while fading in
                if(shouldBeVisible) {
                   this.el.setAttribute('visible', true);
                }
                
                requestAnimationFrame(animate);
            }
        });
    </script>
  </head>

  <body>
    <div id="info" class="visible">Point your camera at the QR Marker 📱</div>

    <div class="ui-container">
      <div class="scale-control-row">
          <label for="scaleSlider">Scale:</label>
          <input type="range" id="scaleSlider" min="0.01" max="2" step="0.01" value="0.09">
          <span id="scaleValue">0.09</span> 
      </div>
      
      <div class="button-row">
        <button id="rotateBtn">Rotate Model</button>
        </div>
    </div>

    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false;"
      style="width:100%; height:100%; margin:0; padding:0;"
    >
      <a-marker type="pattern" url="Patts/qr1.patt" id="marker" emitevents="true">
        <a-entity
          id="model"
          gltf-model="#planeModel"
          scale="0.09 0.09 0.09"
          position="0 0 0"
          animation__spin="property: rotation; to: 0 360 0; dur: 2000; startEvents: spin; easing: linear;"
          animation-mixer="clip: *; loop: repeat; crossFadeDuration: 0;"
          fading-model="visible: false" ></a-entity>
      </a-marker>

      <a-assets>
        <a-asset-item id="planeModel" src="Models/smiling_friends_-_dj_spit.glb"></a-asset-item>
      </a-assets>

      <a-entity
        camera="fov: 95; near: 0.01; far: 1000"
        arjs-camera="sourceType: webcam"
      ></a-entity>
    </a-scene>

    <script>
      // --- Element Selectors ---
      const marker = document.getElementById('marker');
      const model = document.getElementById('model');
      const info = document.getElementById('info');
      const rotateBtn = document.getElementById('rotateBtn');
      const scaleSlider = document.getElementById('scaleSlider');
      // ✅ NEW: Scale Value Label
      const scaleValueLabel = document.getElementById('scaleValue');

      // --- State Variables ---
      let isRotating = false;
      let rotationInterval;

      // --- AR Event Listeners (Idea 8 Logic) ---
      window.addEventListener('load', () => {
        info.classList.add('visible');
      });

      marker.addEventListener('markerFound', () => {
        info.classList.remove('visible');
        info.classList.add('hidden');
        // ✅ NEW: Fade In Model
        model.setAttribute('fading-model', 'visible', true);
      });

      marker.addEventListener('markerLost', () => {
        info.classList.remove('hidden');
        info.classList.add('visible');
        // ✅ NEW: Fade Out Model
        model.setAttribute('fading-model', 'visible', false);
      });

      // --- UI Event Listeners ---
      model.addEventListener('click', () => {
        model.emit('spin');
      });

      rotateBtn.addEventListener('click', () => {
        if (!isRotating) {
          rotationInterval = setInterval(() => {
            const rot = model.getAttribute('rotation');
            rot.y += 1;
            model.setAttribute('rotation', rot);
          }, 4);
          rotateBtn.textContent = 'Stop Rotation';
        } else {
          clearInterval(rotationInterval);
          rotateBtn.textContent = 'Rotate Model';
        }
        isRotating = !isRotating;
      });

      scaleSlider.addEventListener('input', () => {
        const scaleValue = parseFloat(scaleSlider.value).toFixed(2);
        model.setAttribute('scale', `${scaleValue} ${scaleValue} ${scaleValue}`);
        // ✅ NEW: Update scale label (Idea 7)
        scaleValueLabel.textContent = scaleValue;
      });
    </script>
  </body>
</html>
