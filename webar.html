<!DOCTYPE html>
<html>
  <head>
    <title>WebAR QR Scanner - QR 1</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.min.js"></script>
    <style>
      html, body, a-scene {
        margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%;
      }

      /* Info message */
      #info {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        padding: 10px 20px;
        border-radius: 6px;
        font-family: Arial, sans-serif;
        font-size: 16px;
        opacity: 0;
        transition: opacity 1s ease;
        z-index: 999;
      }

      #info.visible {
        opacity: 1;
      }

      #info.hidden {
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="info" class="visible">Point your camera at the QR Marker 📱</div>

    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false;"
      style="width:100%; height:100%; margin:0; padding:0;"
    >
      <!-- Marker for QR1 -->
      <a-marker type="pattern" url="qr1.patt" id="marker">
        <a-entity
          id="model"
          gltf-model="#planeModel"
          scale="1 1 1"
          position="0 0 0"
          animation__spin="property: rotation; to: 0 360 0; dur: 2000; startEvents: spin; easing: linear;"
        ></a-entity>
      </a-marker>

      <a-assets>
        <a-asset-item id="planeModel" src="Models/Cat.glb"></a-asset-item>
      </a-assets>

      <a-entity
        camera="fov: 95; near: 0.01; far: 1000"
        arjs-camera="sourceType: webcam"
        position="0 0 0"
      ></a-entity>
    </a-scene>

    <script>
      const marker = document.getElementById('marker');
      const model = document.getElementById('model');
      const info = document.getElementById('info');

      // Fade in message on load
      window.addEventListener('load', () => {
        info.classList.add('visible');
      });

      // Fade out message when marker detected
      marker.addEventListener('markerFound', () => {
        info.classList.remove('visible');
        info.classList.add('hidden');
      });

      // Optional: Fade back in if marker lost (for UX)
      marker.addEventListener('markerLost', () => {
        info.classList.remove('hidden');
        info.classList.add('visible');
      });

      // Tap to spin the model
      model.addEventListener('click', () => {
        model.emit('spin');
      });
    </script>
  </body>
</html>
