<!DOCTYPE html>
<html>
  <head>
    <title>WebAR QR Scanner - QR 1</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <style>
      html, body, a-scene {
        margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%;
      }

      #info {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        padding: 10px 20px;
        border-radius: 6px;
        font-family: Arial, sans-serif;
        font-size: 16px;
        opacity: 0;
        transition: opacity 1s ease;
        z-index: 999;
      }

      #info.visible { opacity: 1; }
      #info.hidden { opacity: 0; }

      /* Updated selectors to include the new button */
      #rotateBtn, #lockBtn, #playAnimationBtn {
        position: fixed;
        z-index: 999;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
        /* Aligning buttons vertically */
        left: 50%;
        transform: translateX(-50%);
      }

      #rotateBtn { bottom: 120px; }


      /* --- Scale Slider Style --- */
      #scaleSlider {
        position: fixed;
        bottom: 220px; /* Moved down to accommodate new button */
        left: 50%;
        transform: translateX(-50%);
        z-index: 999;
        width: 200px;
        -webkit-appearance: none;
        height: 8px;
        background: #444;
        border-radius: 5px;
        outline: none;
      }
      #scaleSlider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 18px;
        height: 18px;
        background: white;
        border-radius: 50%;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <div id="info" class="visible">Point your camera at the QR Marker 📱</div>
    <button id="rotateBtn">Rotate Model</button>
    <button id="lockBtn">Lock Model in Place</button>
  

    <input type="range" id="scaleSlider" min="0.01" max="2" step="0.01" value="0.09">

    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false;"
      style="width:100%; height:100%; margin:0; padding:0;"
    >
      <a-marker type="pattern" url="Patts/qr1.patt" id="marker" emitevents="true">
        <a-entity
          id="model"
          gltf-model="#planeModel"
          scale="0.09 0.09 0.09"
          position="0 0 0"
          animation__spin="property: rotation; to: 0 360 0; dur: 2000; startEvents: spin; easing: linear;"
          animation-mixer="clip: *; loop: repeat; crossFadeDuration: 0;" /* ⚠️ ADDED: animation-mixer */
        ></a-entity>
      </a-marker>

      <a-assets>
        <a-asset-item id="planeModel" src="Models/smiling_friends_-_dj_spit.glb"></a-asset-item>
      </a-assets>

      <a-entity
        camera="fov: 95; near: 0.01; far: 1000"
        arjs-camera="sourceType: webcam"
      ></a-entity>
    </a-scene>

    <script>
      const marker = document.getElementById('marker');
      const model = document.getElementById('model');
      const info = document.getElementById('info');
      const rotateBtn = document.getElementById('rotateBtn');
      const lockBtn = document.getElementById('lockBtn');
      const scaleSlider = document.getElementById('scaleSlider');

      let isRotating = false;
      let rotationInterval;
      let isLocked = false;
      let lockedClone = null;

      window.addEventListener('load', () => {
        info.classList.add('visible');
      });

      marker.addEventListener('markerFound', () => {
        if (!isLocked) {
          info.classList.remove('visible');
          info.classList.add('hidden');
        }
      });

      marker.addEventListener('markerLost', () => {
        if (!isLocked) {
          info.classList.remove('hidden');
          info.classList.add('visible');
        }
      });

      model.addEventListener('click', () => {
        model.emit('spin');
      });

      rotateBtn.addEventListener('click', () => {
        if (!isRotating) {
          rotationInterval = setInterval(() => {
            const rot = model.getAttribute('rotation');
            rot.y += 1;
            model.setAttribute('rotation', rot);
          }, 4);
          rotateBtn.textContent = 'Stop Rotation';
        } else {
          clearInterval(rotationInterval);
          rotateBtn.textContent = 'Rotate Model';
        }
        isRotating = !isRotating;
      });

      scaleSlider.addEventListener('input', () => {
        const scaleValue = scaleSlider.value;
        model.setAttribute('scale', `${scaleValue} ${scaleValue} ${scaleValue}`);
      });

      lockBtn.addEventListener('click', () => {
        const scene = document.querySelector('a-scene');
        if (!isLocked) {
          const worldPos = new THREE.Vector3();
          const worldRot = new THREE.Euler();
          model.object3D.getWorldPosition(worldPos);
          worldRot.copy(model.object3D.rotation);

          lockedClone = document.createElement('a-entity');
          lockedClone.setAttribute('gltf-model', model.getAttribute('gltf-model'));
          lockedClone.setAttribute('scale', model.getAttribute('scale'));
          lockedClone.object3D.position.copy(worldPos);
          lockedClone.object3D.rotation.copy(worldRot);

          scene.appendChild(lockedClone);
          lockedClone.setAttribute('animation__fade', {
            property: 'scale',
            to: '0.13 0.13 0.13',
            dur: 800,
            easing: 'easeOutElastic'
          });

          isLocked = true;
          lockBtn.textContent = 'Unlock Model';
          alert('Model locked in real-world position ✅');
        } else {
          if (lockedClone) {
            lockedClone.parentNode.removeChild(lockedClone);
          }
          isLocked = false;
          lockBtn.textContent = 'Lock Model in Place';
          alert('Model unlocked 🔓');
        }
      });

      // 🆕 NEW Animation Button Handler
      playAnimationBtn.addEventListener('click', () => {
        // Use the animation-mixer component to play the clip.
        // The default action is to set it to 'loop: once' and play.
        // It will automatically start playing the first (or only) animation clip.
        model.setAttribute('animation-mixer', {
          clip: '*', // Use '*' to match any animation clip in the GLB
          loop: 'repeat',
          timeScale: 1.0, // Ensures it plays at normal speed
          // The component automatically starts the animation when these attributes are set.
        });

        // Optional: Re-add the listener to play it again when it finishes (if needed)
        // or change the button text
        alert('Playing GLB animation! 🎬');
      });
    </script>
  </body>
</html>
