<!DOCTYPE html>
<html>
  <head>
    <title>WebAR QR Scanner - Enhanced</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <style>
      /* --- Global Setup --- */
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        width: 100%;
        height: 100%;
        font-family: Arial, sans-serif;
      }
      a-scene {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }
      * {
        box-sizing: border-box;
      }

      /* --- Top Info Box --- */
      #info {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        padding: 10px 20px;
        border-radius: 6px;
        font-size: 16px;
        opacity: 0;
        transition: opacity 1s ease;
        z-index: 999;
        text-align: center;
      }
      #info.visible { opacity: 1; }
      #info.hidden { opacity: 0; }
      #info.hidden-ui { display: none; }

      /* --- NEW: Easter Egg Text/Confetti Container Style --- */
      #easterEggContainer {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          display: none; /* Initially hidden */
          justify-content: center;
          align-items: center;
          z-index: 1000; 
          background: rgba(0, 0, 0, 0.5); /* Semi-transparent overlay */
          cursor: pointer; /* To indicate it can be tapped to close */
      }
      #easterEggText {
          /* Styling for the text box */
          background: linear-gradient(45deg, #ff6b6b, #ee5253); /* Gradient background */
          color: white;
          padding: 40px 60px;
          border-radius: 15px;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
          font-size: 40px;
          font-weight: bold;
          text-align: center;
          text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
          transform: scale(0); /* Start hidden/small for pop effect */
          animation: popIn 0.3s forwards;
      }
      @keyframes popIn {
          to { transform: scale(1); }
      }
      
      /* --- Confetti Styling (Simple CSS approach) --- */
      .confetti {
        position: absolute;
        width: 10px;
        height: 10px;
        background-color: #f0f;
        opacity: 0;
        animation: confetti-fall 2s ease-out forwards;
      }

      @keyframes confetti-fall {
        0% { transform: translate(var(--x-start, 0), var(--y-start, 0)) rotate(0deg); opacity: 1; }
        100% { transform: translate(var(--x-end, 0), var(--y-end, 800px)) rotate(720deg); opacity: 0; }
      }

      /* --- Double Tap Hint Style --- */
      #doubleTapHint {
          position: fixed;
          top: 80px; 
          left: 50%;
          transform: translateX(-50%);
          background: rgba(0, 0, 0, 0.6);
          color: white;
          padding: 8px 15px;
          border-radius: 4px;
          font-size: 14px;
          z-index: 998;
          opacity: 0;
          pointer-events: none; 
          transition: opacity 0.5s ease;
      }
      #doubleTapHint.visible { opacity: 1; }
      #doubleTapHint.hidden { opacity: 0; }
      #doubleTapHint.hidden-ui { display: none; }


      /* --- Bottom UI Container --- */
      .ui-container {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        z-index: 999;
        display: flex;
        flex-direction: column; 
        align-items: center;    
        padding: 15px;
        gap: 15px; 
        background: linear-gradient(to top, rgba(0,0,0,0.4), rgba(0,0,0,0));
        transition: transform 0.3s ease, opacity 0.3s ease;
      }
      .ui-container.hidden-ui {
          transform: translateY(100%);
          opacity: 0;
          pointer-events: none;
      }


      /* Scale Control Row for Slider and Label */
      .scale-control-row {
          display: flex;
          align-items: center;
          width: 80%;
          max-width: 300px;
          gap: 10px;
          background: rgba(0, 0, 0, 0.5);
          padding: 8px 12px;
          border-radius: 5px;
      }
      #scaleValue {
          color: white;
          font-size: 14px;
          font-weight: bold;
          min-width: 60px;
          text-align: right;
      }


      /* --- Button Row --- */
      .button-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px; 
      }

      /* --- Generic Button Style --- */
      .button-row button {
        background: rgba(0, 0, 0, 0.7);
        color: white;
        border: none;
        padding: 12px 18px;
        border-radius: 5px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        touch-action: manipulation; 
        -webkit-tap-highlight-color: transparent;
        transition: background-color 0.2s ease;
      }
      
      .button-row button:hover {
        background: rgba(255, 255, 255, 0.3);
      }
      .button-row button:active {
        background: rgba(255, 255, 255, 0.5);
      }
      
      /* Distinct style for hide button */
      #hideUiBtn {
          background-color: #5a94f5;
      }


      /* --- Scale Slider Style --- */
      #scaleSlider {
        flex-grow: 1; 
        -webkit-appearance: none;
        height: 8px;
        background: #888;
        border-radius: 5px;
        outline: none;
      }
      #scaleSlider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 20px;
        height: 20px;
        background: white;
        border-radius: 50%;
        cursor: pointer;
      }
      #scaleSlider::-moz-range-thumb {
        width: 20px;
        height: 20px;
        background: white;
        border-radius: 50%;
        cursor: pointer;
        border: 0;
      }
    </style>
    <script>
      AFRAME.registerComponent('fading-model', {
          schema: {
              visible: {type: 'boolean', default: true},
              fadeDuration: {type: 'number', default: 500}
          },

          init: function() {
              this.el.setAttribute('material', 'opacity: 1; transparent: true;');
              this.originalOpacity = 1;
              this.isFading = false;
              this.el.setAttribute('visible', this.data.visible);
          },

          update: function(oldData) {
              if (oldData.visible !== this.data.visible) {
                  this.toggleVisibility(this.data.visible);
              }
          },

          toggleVisibility: function(shouldBeVisible) {
              if (this.isFading) return;
              
              this.isFading = true;
              const targetOpacity = shouldBeVisible ? this.originalOpacity : 0;
              const startOpacity = parseFloat(this.el.getAttribute('material', 'opacity').opacity || this.originalOpacity);
              const duration = this.data.fadeDuration;
              const startTime = performance.now();

              const animate = (time) => {
                  const elapsed = time - startTime;
                  const progress = Math.min(elapsed / duration, 1);
                  const currentOpacity = startOpacity + (targetOpacity - startOpacity) * progress;
                  
                  this.el.setAttribute('material', 'opacity', currentOpacity);

                  if (progress < 1) {
                      requestAnimationFrame(animate);
                  } else {
                      this.isFading = false;
                      this.el.setAttribute('visible', shouldBeVisible);
                  }
              };

              if(shouldBeVisible) {
                 this.el.setAttribute('visible', true);
              }
              
              requestAnimationFrame(animate);
          }
      });
    </script>
  </head>

  <body>
    <div id="info" class="visible">Point your camera at the QR Marker 📱</div>
    
    <div id="doubleTapHint">
        *DOUBLE TAP* anywhere to bring the UI back!
    </div>
    
    <div id="easterEggContainer">
        <div id="easterEggText">I love my GF ❤️</div>
    </div>


    <div class="ui-container" id="uiContainer">
      <div class="scale-control-row">
          <label for="scaleSlider">Scale:</label>
          <input type="range" id="scaleSlider" min="0.01" max="2" step="0.01" value="0.09">
          <span id="scaleValue">0.09</span> 
      </div>
      
      <div class="button-row">
        <button id="rotateBtn">Rotate Model</button>
        <button id="resetBtn">🔄 Reset</button>
        <button id="hideUiBtn">👁️ Hide UI</button>
      </div>
    </div>

    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false;"
      style="width:100%; height:100%; margin:0; padding:0;"
      screenshot="width: 1280; height: 720"
    >
      <a-marker type="pattern" url="Patts/LR.patt" id="marker" emitevents="true">
        <a-entity
          id="model"
          gltf-model="#planeModel"
          scale="0.09 0.09 0.09"
          position="-1 0 0"
          animation__spin="property: rotation; to: 0 360 0; dur: 2000; startEvents: spin; easing: linear;"
          animation-mixer="clip: *; loop: repeat; crossFadeDuration: 0;"
          fading-model="visible: false"
        ></a-entity>
      </a-marker>

      <a-assets>
        <a-asset-item id="planeModel" src="Models/Meshy_AI_Slingshot_Sentinel_0123041741_texture.glb"></a-asset-item>
      </a-assets>

      <a-entity
        camera="fov: 95; near: 0.01; far: 1000"
        arjs-camera="sourceType: webcam"
      ></a-entity>
    </a-scene>

    <script>
      // --- Constants for Tap Logic ---
      const DEFAULT_SCALE_VALUE = 0.09;
      const EASTER_EGG_TAPS = 3; // The required tap count
      const DOUBLE_TAP_DELAY = 300; // ms: Max time between taps for double-tap
      const TAP_RESET_DELAY = 800; // ms: Max time between taps for the N-tap sequence


      // --- Element Selectors ---
      const marker = document.getElementById('marker');
      const model = document.getElementById('model');
      const info = document.getElementById('info');
      const rotateBtn = document.getElementById('rotateBtn');
      const scaleSlider = document.getElementById('scaleSlider');
      const scaleValueLabel = document.getElementById('scaleValue');
      const resetBtn = document.getElementById('resetBtn'); 
      const uiContainer = document.getElementById('uiContainer');
      const hideUiBtn = document.getElementById('hideUiBtn');
      const doubleTapHint = document.getElementById('doubleTapHint');
      const easterEggContainer = document.getElementById('easterEggContainer');


      // --- State Variables ---
      let isRotating = false;
      let rotationInterval;
      let hintTimeout;
      
      // Tap Logic State
      let lastTapTime = 0; // Tracks time for double-tap and 3-tap
      let tapCount = 0;
      let tapTimeout;
      
      // Function to generate confetti effect
      function generateConfetti() {
          const confettiColors = ['#ff00ff', '#00ffff', '#ffff00', '#ff8800', '#00ff00'];
          const numConfetti = 50;
          
          for (let i = 0; i < numConfetti; i++) {
              const confetti = document.createElement('div');
              confetti.className = 'confetti';
              
              // Random positioning (starting from center-top of screen)
              const startX = Math.random() * window.innerWidth - window.innerWidth / 2;
              const startY = -Math.random() * 50; 
              
              // Random end point (falling effect)
              const endX = startX + (Math.random() - 0.5) * 500;
              const endY = window.innerHeight;

              // Apply random color and size
              confetti.style.backgroundColor = confettiColors[Math.floor(Math.random() * confettiColors.length)];
              confetti.style.width = `${Math.random() * 8 + 4}px`;
              confetti.style.height = confetti.style.width;
              
              // Set CSS variables for animation
              confetti.style.setProperty('--x-start', `${startX}px`);
              confetti.style.setProperty('--y-start', `${startY}px`);
              confetti.style.setProperty('--x-end', `${endX}px`);
              confetti.style.setProperty('--y-end', `${endY}px`);
              confetti.style.animationDelay = `${Math.random() * 0.5}s`;
              confetti.style.left = `${window.innerWidth / 2}px`;
              confetti.style.top = `${window.innerHeight / 2}px`;
              
              document.body.appendChild(confetti);

              // Clean up confetti element after animation finishes
              confetti.addEventListener('animationend', () => {
                  confetti.remove();
              });
          }
      }


      // --- UI Control Functions ---

      const hideUI = () => {
          uiContainer.classList.add('hidden-ui');
          info.classList.add('hidden-ui');
          
          doubleTapHint.classList.remove('hidden');
          doubleTapHint.classList.add('visible');
          
          clearTimeout(hintTimeout);
          
          hintTimeout = setTimeout(() => {
              doubleTapHint.classList.remove('visible');
              doubleTapHint.classList.add('hidden');
          }, 5000); 
      };

      const showUI = () => {
          uiContainer.classList.remove('hidden-ui');
          info.classList.remove('hidden-ui');
          
          // Clear and hide the hint immediately when the UI is brought back
          clearTimeout(hintTimeout);
          doubleTapHint.classList.remove('visible');
          doubleTapHint.classList.add('hidden');
          
          // Re-show the standard info visibility based on marker state
          if (marker.getAttribute('visible')) {
              info.classList.remove('visible');
              info.classList.add('hidden');
          } else {
              info.classList.remove('hidden');
              info.classList.add('visible');
          }
      };
      
      // Function to display the Easter Egg Text
      const showEasterEgg = () => {
          // Hide all normal UI elements
          uiContainer.classList.add('hidden-ui');
          info.classList.add('hidden-ui');
          doubleTapHint.classList.add('hidden-ui');
          
          // Generate confetti
          generateConfetti();

          // Reset the tap counter for the next state (exit)
          tapCount = 0; 
          clearTimeout(tapTimeout);
          
          // Display the text container
          easterEggContainer.style.display = 'flex';
      };

      // Function to hide the Easter Egg Text
      const hideEasterEgg = () => {
          easterEggContainer.style.display = 'none';
          
          // Reset tap counter
          tapCount = 0;
          clearTimeout(tapTimeout);

          // Restore normal UI visibility
          showUI(); 
      };


      // --- Marker Found/Lost Logic ---
      window.addEventListener('load', () => {
        info.classList.add('visible');
      });

      marker.addEventListener('markerFound', () => {
        if (!info.classList.contains('hidden-ui')) {
            info.classList.remove('visible');
            info.classList.add('hidden');
        }
        model.setAttribute('fading-model', 'visible', true);
      });

      marker.addEventListener('markerLost', () => {
        if (!info.classList.contains('hidden-ui')) {
            info.classList.remove('hidden');
            info.classList.add('visible');
        }
        model.setAttribute('fading-model', 'visible', false);
      });


      // --- UI Interaction Event Listeners (Model/Controls) ---
      model.addEventListener('click', () => {
        model.emit('spin');
      });

      rotateBtn.addEventListener('click', () => {
        if (!isRotating) {
          rotationInterval = setInterval(() => {
            const rot = model.getAttribute('rotation');
            rot.y += 1;
            model.setAttribute('rotation', rot);
          }, 4);
          rotateBtn.textContent = 'Stop Rotation';
        } else {
          clearInterval(rotationInterval);
          rotateBtn.textContent = 'Rotate Model';
        }
        isRotating = !isRotating;
      });

      scaleSlider.addEventListener('input', () => {
        const scaleValue = parseFloat(scaleSlider.value).toFixed(2);
        model.setAttribute('scale', `${scaleValue} ${scaleValue} ${scaleValue}`);
        scaleValueLabel.textContent = scaleValue;
      });

      resetBtn.addEventListener('click', () => {
          if (isRotating) { 
              clearInterval(rotationInterval);
              isRotating = false;
              rotateBtn.textContent = 'Rotate Model';
          }
          
          const scaleString = `${DEFAULT_SCALE_VALUE} ${DEFAULT_SCALE_VALUE} ${DEFAULT_SCALE_VALUE}`;
          model.setAttribute('scale', scaleString);
          scaleSlider.value = DEFAULT_SCALE_VALUE; 
          scaleValueLabel.textContent = DEFAULT_SCALE_VALUE.toFixed(2);
          
          model.setAttribute('rotation', '0 0 0');

          alert('Model reset to default position and scale!');
      });
      
      hideUiBtn.addEventListener('click', hideUI);
      
      // Tap listener to exit the easter egg popup
      easterEggContainer.addEventListener('click', hideEasterEgg);


      // --- PRIMARY TAP LOGIC (Double-Tap & 3-Tap Easter Egg) ---
      document.body.addEventListener('click', (event) => {
          const currentTime = new Date().getTime();
          const tapLength = currentTime - lastTapTime;
          let doubleTapOccurred = false;

          // 1. --- Easter Egg Exit Logic ---
          if (easterEggContainer.style.display === 'flex') {
              // The tap listener on easterEggContainer handles the exit, 
              // but we need to ensure this main listener doesn't interfere.
              // Since the container covers the whole body, we return here.
              return; 
          }
          
          // 2. --- Double Tap (Show UI) Logic ---
          // Check if the UI is hidden AND the click is not on an active UI element (like a button)
          const isUIHidden = uiContainer.classList.contains('hidden-ui');
          const isNotOnUI = !event.target.closest('.ui-container') && !event.target.closest('#doubleTapHint');
          
          if (isUIHidden && isNotOnUI) {
              if (tapLength < DOUBLE_TAP_DELAY && tapLength > 0) {
                  showUI();
                  doubleTapOccurred = true;
                  lastTapTime = 0; // Reset last tap time to prevent 3-tap interference
              } else {
                  lastTapTime = currentTime;
              }
          }

          // 3. --- 3-Tap Easter Egg Logic ---
          // Only proceed if a double-tap didn't just fire AND the click wasn't on a UI control
          const isNotOnControls = !event.target.closest('.ui-container');

          if (!doubleTapOccurred && isNotOnControls) {
              
              // Reset tap counter if the time between taps is too long
              if (tapLength > TAP_RESET_DELAY || tapLength < 0) {
                  tapCount = 0;
                  clearTimeout(tapTimeout);
              }
              
              tapCount++;
              
              if (tapCount >= EASTER_EGG_TAPS) {
                  showEasterEgg();
                  lastTapTime = 0; // Reset after successfully showing
              } else {
                  // Set timeout to reset tapCount if no subsequent tap occurs in time
                  clearTimeout(tapTimeout); 
                  tapTimeout = setTimeout(() => {
                      tapCount = 0;
                  }, TAP_RESET_DELAY);
                  
                  // Ensure lastTapTime is set for the next tap in the sequence
                  if (!isUIHidden) { // Only update lastTapTime here if we aren't handling double-tap logic above
                      lastTapTime = currentTime; 
                  }
              }
          } else if (doubleTapOccurred) {
              // If double-tap took priority, reset the 3-tap sequence count
              tapCount = 0;
              clearTimeout(tapTimeout);
          }
      });
    </script>
  </body>
</html>
