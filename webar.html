<!DOCTYPE html>
<html>
  <head>
    <title>WebAR QR Scanner - QR 1</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.min.js"></script>
    <style>
      html, body, a-scene {
        margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%;
      }
      #rotateBtn {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 999;
        padding: 10px 20px;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <a-scene embedded arjs style="width:100%; height:100%; margin:0; padding:0;">
      <!-- Marker for QR1 -->
      <a-marker type="pattern" url="qr1.patt">
        <a-entity id="model" gltf-model="#planeModel" scale="0.1 0.1 0.1" position="0 0 0"></a-entity>
      </a-marker>

      <a-assets>
        <a-asset-item id="planeModel" src="Models/iphone.glb"></a-asset-item>
      </a-assets>

      <a-entity
        camera="fov: 95; near: 0.01; far: 1000"
        arjs-camera="sourceType: webcam"
        position="0 0 0">
      </a-entity>
    </a-scene>

    <button id="rotateBtn">Rotate Model</button>

    <script>
      const model = document.getElementById('model');
      const button = document.getElementById('rotateBtn');
      let rotating = false;
      let rotationInterval;

      button.addEventListener('click', () => {
        if (!rotating) {
          rotationInterval = setInterval(() => {
            const rotation = model.getAttribute('rotation');
            rotation.y += 1;
            model.setAttribute('rotation', rotation);
          }, 16); // ~60fps
          button.textContent = 'Stop Rotation';
        } else {
          clearInterval(rotationInterval);
          button.textContent = 'Rotate Model';
        }
        rotating = !rotating;
      });
    </script>
  </body>
</html>
