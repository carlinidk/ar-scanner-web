<!DOCTYPE html>
<html>
  <head>
    <title>WebAR QR Scanner - QR 1</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <style>
      /* --- Global Setup --- */
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        width: 100%;
        height: 100%;
        font-family: Arial, sans-serif;
      }
      a-scene {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }
      * {
        box-sizing: border-box;
      }

      /* --- Top Info Box --- */
      #info {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        padding: 10px 20px;
        border-radius: 6px;
        font-size: 16px;
        opacity: 0;
        transition: opacity 1s ease;
        z-index: 999;
        text-align: center;
      }
      #info.visible { opacity: 1; }
      #info.hidden { opacity: 0; }

      /* --- Bottom UI Container --- */
      .ui-container {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        z-index: 999;
        display: flex;
        flex-direction: column; 
        align-items: center;    
        padding: 15px;
        gap: 15px; 
        background: linear-gradient(to top, rgba(0,0,0,0.4), rgba(0,0,0,0));
      }

      /* --- Button Row --- */
      .button-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px; 
      }

      /* --- Generic Button Style --- */
      .button-row button {
        background: rgba(0, 0, 0, 0.7);
        color: white;
        border: none;
        padding: 12px 18px;
        border-radius: 5px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        touch-action: manipulation; 
        -webkit-tap-highlight-color: transparent;
        transition: background-color 0.2s ease;
      }
      
      .button-row button:hover {
        background: rgba(255, 255, 255, 0.3);
      }
      .button-row button:active {
        background: rgba(255, 255, 255, 0.5);
      }

      /* --- Scale Slider Style --- */
      #scaleSlider {
        width: 80%; 
        max-width: 300px;
        -webkit-appearance: none;
        height: 8px;
        background: #555;
        border-radius: 5px;
        outline: none;
      }
      #scaleSlider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 20px;
        height: 20px;
        background: white;
        border-radius: 50%;
        cursor: pointer;
      }
      #scaleSlider::-moz-range-thumb {
        width: 20px;
        height: 20px;
        background: white;
        border-radius: 50%;
        cursor: pointer;
        border: 0;
      }
    </style>
  </head>

  <body>
    <div id="info" class="visible">Point your camera at the QR Marker 📱</div>

    <div class="ui-container">
      <input type="range" id="scaleSlider" min="0.01" max="2" step="0.01" value="0.09">
      <div class="button-row">
        <button id="rotateBtn">Rotate Model</button>
        </div>
    </div>

    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false;"
      style="width:100%; height:100%; margin:0; padding:0;"
    >
      <a-marker type="pattern" url="Patts/qr1.patt" id="marker" emitevents="true">
        <a-entity
          id="model"
          gltf-model="#planeModel"
          scale="0.09 0.09 0.09"
          position="0 0 0"
          animation__spin="property: rotation; to: 0 360 0; dur: 2000; startEvents: spin; easing: linear;"
          animation-mixer="clip: *; loop: repeat; crossFadeDuration: 0;"
        ></a-entity>
      </a-marker>

      <a-assets>
        <a-asset-item id="planeModel" src="Models/smiling_friends_-_dj_spit.glb"></a-asset-item>
      </a-assets>

      <a-entity
        camera="fov: 95; near: 0.01; far: 1000"
        arjs-camera="sourceType: webcam"
      ></a-entity>
    </a-scene>

    <script>
      // --- Element Selectors ---
      const marker = document.getElementById('marker');
      const model = document.getElementById('model');
      const info = document.getElementById('info');
      const rotateBtn = document.getElementById('rotateBtn');
      const scaleSlider = document.getElementById('scaleSlider');
      // (Removed playAnimationBtn and lockBtn constants)

      // --- State Variables ---
      let isRotating = false;
      let rotationInterval;
      // (Removed isLocked and lockedClone)

      // --- Event Listeners ---
      window.addEventListener('load', () => {
        info.classList.add('visible');
      });

      marker.addEventListener('markerFound', () => {
        // Modified to not check for isLocked
        info.classList.remove('visible');
        info.classList.add('hidden');
      });

      marker.addEventListener('markerLost', () => {
        // Modified to not check for isLocked
        info.classList.remove('hidden');
        info.classList.add('visible');
      });

      model.addEventListener('click', () => {
        model.emit('spin');
      });

      rotateBtn.addEventListener('click', () => {
        if (!isRotating) {
          rotationInterval = setInterval(() => {
            const rot = model.getAttribute('rotation');
            rot.y += 1;
            model.setAttribute('rotation', rot);
          }, 4);
          rotateBtn.textContent = 'Stop Rotation';
        } else {
          clearInterval(rotationInterval);
          rotateBtn.textContent = 'Rotate Model';
        }
        isRotating = !isRotating;
      });

      scaleSlider.addEventListener('input', () => {
        const scaleValue = scaleSlider.value;
        model.setAttribute('scale', `${scaleValue} ${scaleValue} ${scaleValue}`);
      });

      // (Removed lockBtn event listener)
      // (Removed playAnimationBtn event listener)
    </script>
  </body>
</html>
