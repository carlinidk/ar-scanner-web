<!DOCTYPE html>
<html>
  <head>
    <title>WebAR QR Scanner - QR 1</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.min.js"></script>
    <style>
      html, body, a-scene {
        margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%;
      }

      /* Info message */
      #info {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        padding: 10px 20px;
        border-radius: 6px;
        font-family: Arial, sans-serif;
        font-size: 16px;
        opacity: 0;
        transition: opacity 1s ease;
        z-index: 999;
      }

      #info.visible { opacity: 1; }
      #info.hidden { opacity: 0; }

      /* Buttons */
      #rotateBtn, #recordBtn, #lockBtn {
        position: fixed;
        z-index: 999;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
      }

      #rotateBtn {
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
      }

      #recordBtn {
        bottom: 70px;
        left: 50%;
        transform: translateX(-50%);
      }

      #lockBtn {
        bottom: 120px;
        left: 50%;
        transform: translateX(-50%);
      }
    </style>
  </head>

  <body>
    <div id="info" class="visible">Point your camera at the QR Marker 📱</div>
    <button id="rotateBtn">Rotate Model</button>
    <button id="recordBtn">Start Recording</button>
    <button id="lockBtn">Lock Model in Place</button>

    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false;"
      style="width:100%; height:100%; margin:0; padding:0;"
    >
      <!-- Marker for QR1 -->
      <a-marker type="pattern" url="Patts/qr1.patt" id="marker" emitevents="true">
        <a-entity
          id="model"
          gltf-model="#planeModel"
          scale="0.13 0.13 0.13"
          position="0 0 0"
          animation__spin="property: rotation; to: 0 360 0; dur: 2000; startEvents: spin; easing: linear;"
        ></a-entity>
      </a-marker>

      <a-assets>
        <a-asset-item id="planeModel" src="Models/ImageToStl.com_Cat.glb"></a-asset-item>
      </a-assets>

      <a-entity
        camera="fov: 95; near: 0.01; far: 1000"
        arjs-camera="sourceType: webcam"
        position="0 0 0"
      ></a-entity>
    </a-scene>

    <script>
      const marker = document.getElementById('marker');
      const model = document.getElementById('model');
      const info = document.getElementById('info');
      const rotateBtn = document.getElementById('rotateBtn');
      const recordBtn = document.getElementById('recordBtn');
      const lockBtn = document.getElementById('lockBtn');

      let isRotating = false;
      let rotationInterval;
      let isLocked = false;
      let lockedClone = null;

      // Fade in message on load
      window.addEventListener('load', () => {
        info.classList.add('visible');
      });

      marker.addEventListener('markerFound', () => {
        if (!isLocked) {
          info.classList.remove('visible');
          info.classList.add('hidden');
        }
      });

      marker.addEventListener('markerLost', () => {
        if (!isLocked) {
          info.classList.remove('hidden');
          info.classList.add('visible');
        }
      });

      model.addEventListener('click', () => {
        model.emit('spin');
      });

      // Rotate model button
      rotateBtn.addEventListener('click', () => {
        if (!isRotating) {
          rotationInterval = setInterval(() => {
            const rot = model.getAttribute('rotation');
            rot.y += 1;
            model.setAttribute('rotation', rot);
          }, 4);
          rotateBtn.textContent = 'Stop Rotation';
        } else {
          clearInterval(rotationInterval);
          rotateBtn.textContent = 'Rotate Model';
        }
        isRotating = !isRotating;
      });

      // --- Recording setup ---
      let mediaRecorder;
      let recordedChunks = [];
      let isRecording = false;
      let drawInterval;

      recordBtn.addEventListener('click', () => {
        const sceneCanvas = document.querySelector('canvas');
        const videoEl = document.querySelector('video');

        if (!isRecording) {
          const offCanvas = document.createElement('canvas');
          offCanvas.width = sceneCanvas.width;
          offCanvas.height = sceneCanvas.height;
          const ctx = offCanvas.getContext('2d');

          drawInterval = setInterval(() => {
            ctx.drawImage(videoEl, 0, 0, offCanvas.width, offCanvas.height);
            ctx.drawImage(sceneCanvas, 0, 0, offCanvas.width, offCanvas.height);
          }, 1000 / 60);

          const stream = offCanvas.captureStream(60);
          mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });

          mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) recordedChunks.push(e.data);
          };

          mediaRecorder.onstop = () => {
            clearInterval(drawInterval);
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = 'ar-recording.webm';
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
            recordedChunks = [];
          };

          mediaRecorder.start();
          recordBtn.textContent = 'Stop Recording';
        } else {
          mediaRecorder.stop();
          recordBtn.textContent = 'Start Recording';
        }
        isRecording = !isRecording;
      });

      // --- Lock button functionality ---
      lockBtn.addEventListener('click', () => {
        if (!isLocked) {
          // Clone and fix model in place
          const clone = model.cloneNode(true);
          const scene = document.querySelector('a-scene');
          const worldPos = new THREE.Vector3();
          model.object3D.getWorldPosition(worldPos);

          clone.setAttribute('position', `${worldPos.x} ${worldPos.y} ${worldPos.z}`);
          scene.appendChild(clone);
          lockedClone = clone;

          lockBtn.textContent = 'Unlock Model';
          isLocked = true;
          alert('Model locked in place ✅');
        } else {
          if (lockedClone) lockedClone.parentNode.removeChild(lockedClone);
          lockBtn.textContent = 'Lock Model in Place';
          isLocked = false;
          alert('Model unlocked 🔓');
        }
      });
    </script>
  </body>
</html>
